global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bitcoin-exporter'
    static_configs:
      - targets: ['bitcoin-exporter:9332']
        labels:
          instance: 'bitcoin-node1'
          network: 'regtest'
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

